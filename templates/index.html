<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bingo AI</title>
</head>
<body>

<h2>🎯 賓果賓果 AI</h2>

<select id="count">
<option value="1">1星</option>
<option value="2">2星</option>
<option value="3">3星</option>
<option value="4">4星</option>
<option value="5">5星</option>
<option value="6">6星</option>
<option value="7">7星</option>
<option value="8">8星</option>
<option value="9">9星</option>
<option value="10">10星</option>
</select>

<button onclick="pick()">選號</button>
<button onclick="start()">開始監控</button>

<h3 id="result"></h3>
<h3 id="draw"></h3>
<h3 id="hit"></h3>

<script>

let my=[]
let timer=null

function pick(){
 let c = document.getElementById("count").value

 fetch("/pick",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({count:c})
 })
 .then(r=>r.json())
 .then(j=>{
    my=j.numbers
    document.getElementById("result").innerText =
    "你的號碼: "+j.numbers.join(", ")
 })
}

function start(){
 if(timer) return
 update()
 timer = setInterval(update,3000)
}

function update(){
 if(my.length===0){
   document.getElementById("hit").innerText="請先選號"
   return
 }

 fetch("/monitor?nums="+my.join(","))
 .then(r=>r.json())
 .then(j=>{
    document.getElementById("draw").innerText =
    "期數:"+j.term+" 時間:"+j.time+" 開獎:"+j.draw.join(", ")

    document.getElementById("hit").innerText =
    "命中:"+j.hit.join(", ")
 })
}

</script>

</body>
</html>
