<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bingo</title>
</head>
<body>

<h2>🎯 Bingo穩定版</h2>

<select id="count">
<option value="3">3星</option>
<option value="5">5星</option>
<option value="10">10星</option>
</select>

<button onclick="pick()">選號</button>
<button onclick="start()">開始監控</button>

<h3 id="my"></h3>
<h3 id="info"></h3>
<h3 id="draw"></h3>
<h3 id="hit"></h3>

<script>

let my=[]
let timer=null

function balls(draw,hit){
 return draw.map(n=>{
   return hit.includes(n)?"🔴"+n:"⚪"+n
 }).join(" ")
}

function pick(){
 let c=document.getElementById("count").value

 fetch("/pick",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({count:c})
 })
 .then(r=>r.json())
 .then(j=>{
   my=j.numbers
   document.getElementById("my").innerText =
   "你的號碼："+my.join(", ")
 })
}

function start(){
 if(timer) return
 update()
 timer=setInterval(update,3000)
}

function update(){
 if(my.length===0){
   document.getElementById("hit").innerText="⚠請先選號"
   return
 }

 fetch("/monitor?nums="+my.join(","))
 .then(r=>r.json())
 .then(j=>{

   if(!j.draw || j.draw.length===0){
      document.getElementById("draw").innerText="⚠抓不到資料"
      return
   }

   document.getElementById("info").innerText =
   "期數:"+j.term+" ("+j.source+")\n時間:"+j.time

   document.getElementById("draw").innerText =
   "開獎："+balls(j.draw,j.hit)

   document.getElementById("hit").innerText =
   "命中："+j.hit.length+" 顆 → "+j.hit.join(", ")
 })
}

</script>

</body>
</html>
